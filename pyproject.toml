[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amrrules"
version = "1.1.0"
description = "Organism-specific interpretation of AMR genotypes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["obonet>=1.1.1"]

authors = [
  { name = "Jane Hawkey", email = "jane.hawkey@monash.edu" }
]

[project.urls]
Homepage = "https://github.com/AMRverse/AMRrules"
Documentation = "https://docs.amrrules.org"
Issues = "https://github.com/AMRverse/AMRrules/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amrrules = ["resources/amrfp_to_card_drugs_classes.txt"]

[project.scripts]
amrrules = "amrrules.cli:main"

# -----------------------------------------------------------------------
# Pixi environment for local development. This is deliberately separate
# from [project.dependencies] above: those are amrrules' actual runtime
# deps (just obonet). pandas/pyyaml below are ONLY needed for the
# tests/scripts/ regression-checking tooling, not for amrrules itself.
#
# Setup (one-time):
#   pixi install
# Then either point VSCode's Python interpreter at .pixi/envs/default/bin/python,
# or run everything via `pixi run ...` (see tasks below) without activating
# anything.
# -----------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.dependencies]
python = "3.12.*"
pandas = "*"
pyyaml = "*"
docutils = ">=0.22.4,<0.23"
sphinx = ">=9.1.1,<10"
pip = ">=26.2.2,<27"
sphinx-book-theme = ">=1.4.0,<2"
sphinx-design = ">=0.7.0,<0.8"
sphinx-csv-filter = ">=0.3.0,<0.4"

# Installs amrrules itself (editable) into the pixi environment, which also
# pulls in obonet from [project.dependencies] above via pip - so obonet
# doesn't need to be listed again here.
[tool.pixi.pypi-dependencies]
amrrules = { path = ".", editable = true }

[tool.esbonio.sphinx]
pythonCommand = [".pixi/envs/default/bin/python"]
confDir = "docs"
srcDir = "docs/source"

# Convenience shortcuts - run with `pixi run <task-name>`, no shell
# activation needed.
[tool.pixi.tasks]
check-regressions = "python tests/scripts/check_regressions.py"
run-examples = "python tests/scripts/run_examples.py --output-dir tests/data/local_output"
generate-launch-json = "python tests/scripts/generate_launch_json.py"
