[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amrrules"
version = "1.0.1"
description = "Organism-specific interpretation of AMR genotypes"
authors = [
  { name = "Jane Hawkey", email = "jane.hawkey@monash.edu" }
]
requires-python = ">=3.12"

dependencies = [
    "obonet>=1.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amrrules = ["rules/*"]

[project.scripts]
amrrules = "amrrules.cli:main"

# -----------------------------------------------------------------------
# Pixi environment for local development. This is deliberately separate
# from [project.dependencies] above: those are amrrules' actual runtime
# deps (just obonet). pandas/pyyaml below are ONLY needed for the
# tests/scripts/ regression-checking tooling, not for amrrules itself.
#
# Setup (one-time):
#   pixi install
# Then either point VSCode's Python interpreter at .pixi/envs/default/bin/python,
# or run everything via `pixi run ...` (see tasks below) without activating
# anything.
# -----------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.dependencies]
python = "3.12.*"
pandas = "*"
pyyaml = "*"

# Installs amrrules itself (editable) into the pixi environment, which also
# pulls in obonet from [project.dependencies] above via pip - so obonet
# doesn't need to be listed again here.
[tool.pixi.pypi-dependencies]
amrrules = { path = ".", editable = true }

# Convenience shortcuts - run with `pixi run <task-name>`, no shell
# activation needed.
[tool.pixi.tasks]
check-regressions = "python tests/scripts/check_regressions.py"
run-examples = "python tests/scripts/run_examples.py --output-dir tests/data/local_output"
generate-launch-json = "python tests/scripts/generate_launch_json.py"