name: Generate Example Outputs

on:
  push:
    branches:
      - main

jobs:
  generate-outputs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and dependencies
        run: make dev

      - name: Download required resources
        run: amrrules --download-resources

      # -----------------------------------------------------------------------
      # All example cases are defined in tests/example_commands.yaml - edit
      # that file to add/remove/change a case, not this workflow.
      # -----------------------------------------------------------------------
      - name: Run example commands
        run: python tests/scripts/run_examples.py --output-dir tests/data/example_output

      # -----------------------------------------------------------------------
      # Commit and push any new or changed output files back to the branch.
      # If nothing changed (outputs are identical), the step is a no-op.
      # -----------------------------------------------------------------------
      - name: Commit and push generated outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/data/example_output/
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore: regenerate example outputs [skip ci]"
          git push
