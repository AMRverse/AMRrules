# Debug-only cases: NOT run by CI and NOT included in the regression check
# by default (see tests/scripts/check_regressions.py --include-debug-cases).
# These use inputs that live outside tests/data/input (a debug/ folder, or
# large gzipped ATB downloads) so they may not be reproducible in CI or on
# a fresh checkout. Kept here so they're still tracked in ONE place and
# available for ad-hoc local debugging, instead of only living in
# launch.json where they're easy to lose track of.
# -----------------------------------------------------------------------
