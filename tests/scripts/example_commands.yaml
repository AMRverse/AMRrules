# Single source of truth for every "example" / regression-test amrrules run.
#
# This file drives:
#   - the GitHub Actions workflow (generate-example-outputs.yml), which
#     regenerates tests/data/example_output on every push to main
#   - your local regression check (tests/scripts/check_regressions.py), which
#     regenerates outputs from your *current* working code into a scratch
#     dir and diffs them against tests/data/example_output using
#     compare_outputs.py
#   - (optionally) .vscode/launch.json, via tests/scripts/generate_launch_json.py,
#     so your debug configs can never silently drift from the CI cases again
#
# Edit THIS FILE when you add/remove a test case. Don't hand-edit the yml
# workflow's run list or launch.json's configurations list directly - they
# should be regenerated / driven from here so there's only one place to keep
# up to date.
#
# Fields:
#   name         - unique id, used as --output-prefix and as the diff report
#                  filename. Keep it stable across time (it's the join key
#                  between old and new outputs).
#   input        - path to input file, relative to repo root
#   organism     - use this OR organism_file, not both
#   organism_file
#   flag_core    - true to pass --flag-core
#   nr           - value for -nr (none / nwt / nwtS / nwtR), omit for default
#   sample_id    - value for --sample-id, only needed if it's expected to
#                  differ from the default derived from the input filename
#   extra_args   - list of any other flags not covered above

cases:
